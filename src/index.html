<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <title>Enrosed — Sales &amp; Sourcing</title>
  <base href="/">
  <!-- viewport-fit=cover so the tab bar runs into the iPhone's safe area -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- The phone status bar matches the staff screens' beige; the desk keeps white. -->
  <meta name="theme-color" content="#f2efeb" media="(max-width: 679.98px), (hover: none) and (max-width: 1023.98px)">
  <meta name="theme-color" content="#ffffff">

  <!-- Installable web app. On an iPhone "Zet op beginscherm" then opens it
       full screen, without Safari's address bar and tabs. Safari reads
       display:standalone from the manifest; the apple-* tags cover older
       iOS versions and set the home-screen name and icon. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Enrosed">
  <!-- Opaque: the page starts below the status bar (iOS 26/27 blur what lies under a translucent one). On an iPhone Duo
       the shell switches it to black-translucent at start-up, so the next "Zet op beginscherm" lets the page into the
       Duo's side strip (core/platform/duo-status-bar.ts). -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <!-- A build file the browser keeps as the app's page leaves the app blank: a host asked for a file it has not got yet
       answers with this page (200, text/html), and vercel.json marks every main-/chunk-/styles- file immutable for a year,
       so that answer stays (seen 2026-11-15 after a release). When such a file fails to load, it is fetched again past
       the cache, which replaces the stored answer, and the page loads once more; at most once per file and session, and
       only when the host now gives the real file. -->
  <script>
    (function () {
      var BUILD_FILE = /\/(?:main|polyfills|styles|chunk)-[\w-]+\.(?:js|css)(?:[?#].*)?$/;
      var KEY = 'enrosed.buildFileRescue';
      var busy = false;
      function rescued(url) {
        try { return (sessionStorage.getItem(KEY) || '').split(' ').indexOf(url) >= 0; } catch (e) { return true; }
      }
      function remember(url) {
        try { sessionStorage.setItem(KEY, ((sessionStorage.getItem(KEY) || '') + ' ' + url).trim()); } catch (e) { /* no session storage: no rescue */ }
      }
      function rescue(url, tries) {
        fetch(url, { cache: 'reload' }).then(function (response) {
          var type = response.headers.get('content-type') || '';
          if (response.ok && /javascript|ecmascript|css/i.test(type)) { remember(url); location.reload(); return; }
          if (tries > 1) setTimeout(function () { rescue(url, tries - 1); }, 4000);
        }, function () {
          if (tries > 1) setTimeout(function () { rescue(url, tries - 1); }, 4000);
        });
      }
      window.addEventListener('error', function (event) {
        var element = event.target;
        if (busy || !element || (element.tagName !== 'SCRIPT' && element.tagName !== 'LINK')) return;
        var url = element.src || element.href || '';
        if (!BUILD_FILE.test(url) || rescued(url) || typeof fetch !== 'function') return;
        busy = true;
        rescue(url, 5);
      }, true);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
